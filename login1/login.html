<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Halaman Login</h2>
    <label for="username">Username:</label><br>
    <input type="text" id="username"><br><br>
    <label>Password:</label><br>
    <input type="password" id="password"><br><br>
    <button onclick="login()">Login</button>
    <p id="hasil"></p>
    <script>
        function login() {
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            if (username === "admin" && password === "admin123") {
                window.location.href = "admin.html";
            } else if (username === "dosen" && password == "dosen123") {
                window.location.href = "dosen.html";
            } else if (username === "mahasiswa" && password == "mahasiswa123") {
                window.location.href = "mahasiswa.html";
            } else {
                document.getElementById("hasil").innerHTML = "Username atau password salah.";
            }
        }
    </script>
</body>
</htm
